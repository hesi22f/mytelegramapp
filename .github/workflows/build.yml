name: Build Telegram APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: '' 

    - name: Accept Android SDK Licenses
      run: |
        export SDKMANAGER_PATH=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
        yes | $SDKMANAGER_PATH --licenses || true
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/google-tv-preview-license

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        # اگر فایل gradlew بود از خودش استفاده کن، وگرنه از Gradle نصب شده
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f TMessagesProj/gradlew ]; then
          cd TMessagesProj
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, using system gradle"
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Debug-APK
        path: |
          TMessagesProj/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
